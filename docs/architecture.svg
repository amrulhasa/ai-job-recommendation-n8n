<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<rect width="1400" height="520" fill="#0d1117"/>
<text x="70" y="65" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="32" font-weight="700">AI Personalized Job Recommendation System</text>
<text x="70" y="100" fill="#8b949e" font-family="Arial, sans-serif" font-size="18">n8n workflow architecture</text>

<g font-family="Arial, sans-serif">
<rect x="60" y="175" rx="16" width="190" height="100" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="155" y="215" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">Candidate Form</text>
<text x="155" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14">Skills • Location</text>
<text x="155" y="263" text-anchor="middle" fill="#c9d1d9" font-size="14">Experience • Work mode</text>

<rect x="300" y="175" rx="16" width="190" height="100" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="395" y="215" text-anchor="middle" fill="#a371f7" font-size="18" font-weight="700">AI Planning</text>
<text x="395" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14">Candidate analysis</text>
<text x="395" y="263" text-anchor="middle" fill="#c9d1d9" font-size="14">Targeted queries</text>

<rect x="540" y="175" rx="16" width="190" height="100" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="635" y="215" text-anchor="middle" fill="#3fb950" font-size="18" font-weight="700">Job Search</text>
<text x="635" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14">Serper API</text>
<text x="635" y="263" text-anchor="middle" fill="#c9d1d9" font-size="14">Current web results</text>

<rect x="780" y="175" rx="16" width="190" height="100" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
<text x="875" y="215" text-anchor="middle" fill="#f0883e" font-size="18" font-weight="700">JavaScript</text>
<text x="875" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14">Transform &amp; clean</text>
<text x="875" y="263" text-anchor="middle" fill="#c9d1d9" font-size="14">Prepare job data</text>

<rect x="1020" y="175" rx="16" width="190" height="100" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="1115" y="215" text-anchor="middle" fill="#d2a8ff" font-size="18" font-weight="700">AI Matching</text>
<text x="1115" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14">Score &amp; rank</text>
<text x="1115" y="263" text-anchor="middle" fill="#c9d1d9" font-size="14">Explain fit / mismatch</text>

<path d="M250 225 H300" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M490 225 H540" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M730 225 H780" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M970 225 H1020" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="420" y="360" rx="16" width="250" height="90" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
<text x="545" y="397" text-anchor="middle" fill="#79c0ff" font-size="18" font-weight="700">Structured Output</text>
<text x="545" y="425" text-anchor="middle" fill="#c9d1d9" font-size="14">Consistent recommendation JSON</text>

<rect x="730" y="360" rx="16" width="250" height="90" fill="#161b22" stroke="#db61a2" stroke-width="2"/>
<text x="855" y="397" text-anchor="middle" fill="#db61a2" font-size="18" font-weight="700">Gmail Delivery</text>
<text x="855" y="425" text-anchor="middle" fill="#c9d1d9" font-size="14">Personalized HTML email</text>

<path d="M1115 275 V325 H545 V360" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M670 405 H730" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

<text x="70" y="485" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">Credentials stay in n8n; API keys are not stored in the public workflow JSON.</text>
</g>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
</defs>
</svg>